<div class="min-h-screen bg-slate-100 flex flex-col">
  <!-- Navbar estilo Material -->
  <mat-toolbar class="!bg-lakers-purple !text-white flex justify-between shadow-md px-6">
    <span class="font-extrabold text-xl tracking-wide text-lakers-gold">My Finance App</span>
    
    <button
      mat-flat-button
      (click)="onLogout()"
      class="!bg-lakers-gold !text-lakers-purple-dark hover:!bg-lakers-gold-hover font-bold flex items-center gap-1"
    >
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-toolbar>

  <!-- Contenido Principal -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="text-center bg-white p-10 rounded-2xl shadow-xl max-w-lg border-t-4 border-lakers-purple">
      <h1 class="text-4xl font-extrabold text-lakers-purple mb-4">Welcome to My Finance App</h1>
      <p class="text-slate-600">You have successfully logged in.</p>
    </div>
  </main>
</div>
